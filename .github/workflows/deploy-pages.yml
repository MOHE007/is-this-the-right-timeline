name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          set -e
          rm -rf _site && mkdir -p _site/cards _site/demo1
          cp -R demo2-web/* _site/
          cp -R demo1/* _site/demo1/
          cp -R cards/yuefei _site/cards/yuefei
          cp -R cards/xinqiji _site/cards/xinqiji
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

      # jsDelivr fetches objects from GitHub on first request and that origin is
      # slow for some regions, which made the wasm parts stall for players.
      # Warm the edge cache from the runner (fast egress) so visitors hit a hot
      # cache. Re-run this whenever demo2-web changes.
      - name: Warm the jsDelivr cache
        run: |
          BASE="https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/demo2-web"
          for f in index.html index.js index.pck index.wasm.part1 index.wasm.part2 index.wasm.part3; do
            curl -sf -o /dev/null "$BASE/$f" && echo "warm ok: $f" || echo "warm failed: $f"
          done
