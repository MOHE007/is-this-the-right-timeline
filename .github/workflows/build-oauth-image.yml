name: build-oauth-image

on:
  push:
    paths:
      - "zhihu-oauth/**"
      - ".github/workflows/build-oauth-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: zhihu-oauth
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/zhihu-oauth:latest
            ghcr.io/${{ github.repository_owner }}/zhihu-oauth:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
