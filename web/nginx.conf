server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # wasm / pck 需要正确的类型；Godot 的 WebAssembly.instantiateStreaming 依赖 application/wasm。
    types {
        application/wasm                 wasm;
        application/octet-stream         pck;
        text/javascript                  js;
        text/html                        html;
        image/png                        png;
        image/jpeg                       jpg jpeg;
        image/webp                       webp;
        audio/ogg                        ogg;
        application/json                 json;
    }
    default_type application/octet-stream;

    # 引擎 wasm 压缩收益很大；pck 本身是已压缩纹理，gzip 增益有限但无害。
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/wasm application/octet-stream text/javascript text/css text/html application/json;

    # 产物内容哈希不固定，用短缓存 + 允许复用，避免每次全量重下。
    location / {
        add_header Cache-Control "public, max-age=600";
        try_files $uri $uri/ =404;
    }

    location ~* \.(wasm|pck)$ {
        add_header Cache-Control "public, max-age=600";
        try_files $uri =404;
    }
}
