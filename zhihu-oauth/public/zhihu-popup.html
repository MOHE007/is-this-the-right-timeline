<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>知乎授权</title>
    <style>
      body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
             background: #12100e; color: #e8e2d6; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .card { text-align: center; padding: 28px 32px; border: 1px solid #3a342c; border-radius: 10px; background: #1a1713; max-width: 340px; }
      .stamp { font-size: 34px; margin-bottom: 10px; }
      h1 { font-size: 17px; margin: 0 0 8px; font-weight: 600; }
      p { font-size: 13px; line-height: 1.7; margin: 6px 0; color: #b8b0a2; }
      .name { color: #d9a05b; font-weight: 600; }
      button { margin-top: 16px; padding: 8px 18px; font-size: 13px; border-radius: 6px; cursor: pointer;
               border: 1px solid #4a4238; background: #26211b; color: #e8e2d6; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="stamp" id="stamp">⏳</div>
      <h1 id="title">正在读取授权结果…</h1>
      <p id="detail"></p>
      <button id="close" hidden>关闭窗口</button>
    </div>
    <script>
      // This page is same-origin with the API, so it reads the session here and
      // relays the result to the game window — the game never calls the API
      // cross-origin, so no CORS or third-party cookie problems.
      //
      // The summary spans five account interfaces and each upstream call can
      // take many seconds, so the connection result is relayed immediately and
      // the counts follow as a second message.
      (async () => {
        const params = new URLSearchParams(location.search);
        const failed = params.get('oauth') === 'error';
        let relayOrigin = '*';
        try {
          const relay = await fetch('/api/oauth/relay').then((r) => r.json());
          if (relay?.origin) relayOrigin = relay.origin;
        } catch (error) { /* fall back to '*' */ }

        const send = (payload) => {
          try {
            if (window.opener && !window.opener.closed) window.opener.postMessage(payload, relayOrigin);
          } catch (error) { /* the player can retry */ }
        };

        const stamp = document.getElementById('stamp');
        const title = document.getElementById('title');
        const detail = document.getElementById('detail');
        const closeButton = document.getElementById('close');

        let status = null;
        try {
          status = await fetch('/api/oauth/status', { headers: { accept: 'application/json' } }).then((r) => r.json());
        } catch (error) { /* handled as failure below */ }

        const ok = !failed && status?.authorized;
        const profile = status?.profile || {};

        // 1. Relay the connection result right away.
        send({
          type: 'ithrtt-zhihu',
          status: ok ? 'ok' : 'error',
          name: profile.name || null,
          avatar: profile.avatarUrl || null,
          headline: profile.headline || null,
          url: profile.url || null,
          counts: null,
          message: status?.error?.message || null,
        });

        stamp.textContent = ok ? '✓' : '×';
        title.textContent = ok ? '已连接知乎' : '授权未完成';
        detail.innerHTML = ok
          ? (profile.name ? `账号：<span class="name">${profile.name}</span><br />正在读取你的创作 / 关注 / 收藏…` : '正在读取你的创作 / 关注 / 收藏…')
          : (status?.error?.message || '请回到游戏重试，或检查知乎开放平台的回调登记。');
        closeButton.hidden = false;
        closeButton.addEventListener('click', () => window.close());

        if (!ok) return;

        // 2. Counts arrive separately; give up quietly if they are slow.
        try {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 25000);
          const summary = await fetch('/api/oauth/summary', { signal: controller.signal }).then((r) => r.json());
          clearTimeout(timer);
          const counts = summary?.counts || {};
          send({ type: 'ithrtt-zhihu', status: 'ok', name: profile.name || null, counts, update: true });
          detail.innerHTML = `账号：<span class="name">${profile.name || '已连接'}</span><br />创作 ${counts.contents ?? 0} · 关注 ${counts.followees ?? 0} · 收藏夹 ${counts.favlists ?? 0}`;
        } catch (error) {
          detail.innerHTML = `<span class="name">${profile.name || '已连接'}</span><br />账号数据读取较慢，可以直接开始游戏。`;
        }

        setTimeout(() => window.close(), 2500);
      })();
    </script>
  </body>
</html>
